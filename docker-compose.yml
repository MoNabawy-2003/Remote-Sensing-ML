version: "3.9"

services:
  app:
    build: .
    ports:
      - "3000:3000"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
      - ./nginx-entrypoint.sh:/nginx-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/nginx-entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health >/dev/null && wget -qO- --no-check-certificate https://localhost/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot-init.sh:/certbot-init.sh:ro
    environment:
      CERTBOT_EMAIL: naboy22446688@gmail.com
    entrypoint: ["/bin/sh", "/certbot-init.sh"]
